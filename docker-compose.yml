services:
  web:
    build:
      context: .
    command: npm run dev:web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Anonymous volume refreshed from the image on each `npm run dev` (--renew-anon-volumes), so new dependencies are picked up.
      - /app/node_modules
      - web-next:/app/apps/web/.next
    depends_on:
      - api

  api:
    build:
      context: .
    command: npm run dev:api
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@previley.local}
      DEV_USER_NAME: ${DEV_USER_NAME:-Usuario de desarrollo}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgres://transformador:transformador@postgres:5432/transformador
      REDIS_URL: redis://redis:6379
      TEMP_DIR: /tmp/previley-excel-transformer
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - temp-files:/tmp/previley-excel-transformer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    command: npm run dev:worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://transformador:transformador@postgres:5432/transformador
      REDIS_URL: redis://redis:6379
      TEMP_DIR: /tmp/previley-excel-transformer
    volumes:
      - .:/app
      - /app/node_modules
      - temp-files:/tmp/previley-excel-transformer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transformador
      POSTGRES_USER: transformador
      POSTGRES_PASSWORD: transformador
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transformador -d transformador"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web-next:
  postgres-data:
  redis-data:
  temp-files:
